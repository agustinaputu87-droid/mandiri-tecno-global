name: Build APK

on:
  push:
    paths:
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Buat proyek Android
        run: |
          mkdir app
          cd app
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          echo '<!doctype html><title>Mandiri Tecno Global</title>' > www/index.html
          echo '{"appId":"id.my.managementpandita.mtg","appName":"Mandiri Tecno Global","webDir":"www","server":{"url":"https://managementpandita.my.id/mandiri-tecno-global/","androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Siapkan berkas
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk MandiriTecnoGlobal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MandiriTecnoGlobal-apk
          path: MandiriTecnoGlobal.apk

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" MandiriTecnoGlobal.apk \
            --title "APK Mandiri Tecno Global #${{ github.run_number }}" \
            --notes "Unduh MandiriTecnoGlobal.apk lalu pasang di Android."
